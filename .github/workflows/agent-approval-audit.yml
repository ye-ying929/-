name: agent-approval-audit
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  check:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action/agent-approval-check@925afb53776cf1a2b738c6bdbed37b4d4000ef13
        with:
          required_approvals: 2
          agent_emails: audit-agent@example.invalid
          agent_logins: claude[bot],claude-code[bot]
          docs_url: https://example.invalid/authorized-audit
