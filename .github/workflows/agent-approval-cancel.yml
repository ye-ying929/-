name: Live agent approval cancel-window audit
on:
  pull_request_target:
    types: [opened]
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Synthetic pre-action wait
        run: sleep 120
      - name: Run agent approval check
        uses: anthropics/claude-code-action/agent-approval-check@925afb53776cf1a2b738c6bdbed37b4d4000ef13
        with:
          required_approvals: 2
          agent_emails: noreply@anthropic.com
          agent_logins: claude[bot],claude-code[bot]
          protected_bases: main,release
