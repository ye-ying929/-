name: synthetic-bot-pr-fixture
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  create-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Create bot-authored PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          base_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          branch='audit/bot-review-pagination-20261027'
          gh api -X POST "repos/$GH_REPO/git/refs" -f "ref=refs/heads/$branch" -f "sha=$base_sha"
          content=$(printf '%s' 'synthetic bot-authored PR marker' | base64 -w0)
          gh api -X PUT "repos/$GH_REPO/contents/bot-review-pagination.txt" \
            -f message='audit: create bot-authored pagination fixture' \
            -f content="$content" -f branch="$branch"
          gh api -X POST "repos/$GH_REPO/pulls" \
            -f title='audit: bot-authored review pagination fixture' \
            -f head="$branch" -f base='main' -f body='Synthetic owner-controlled audit fixture; no secrets.'