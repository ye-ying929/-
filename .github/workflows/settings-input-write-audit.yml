name: settings input write audit

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  audit:
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@settings-write-audit')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Run pinned Claude Code Action
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: synthetic-audit-key
          settings: review/settings.json
          prompt: "settings input write audit"
          claude_args: "--permission-mode auto --max-turns 1"
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:9
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

      - name: Verify marker
        if: always()
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/settings-audit-marker" ]]; then
            echo "SETTINGS_MARKER=present"
            cat "$GITHUB_WORKSPACE/settings-audit-marker"
          else
            echo "SETTINGS_MARKER=absent"
            exit 1
          fi
