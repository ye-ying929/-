name: impact-write-probe

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  metadata: read

jobs:
  probe:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '@claude') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head for controlled fixture
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Start loopback 401 API stub
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/impact-write-api.log 2>&1 &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  self.send_response(401)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'{"error":{"type":"authentication_error","message":"synthetic"}}')
              def log_message(self, *_args):
                  pass
          HTTPServer(('127.0.0.1', 18080), Handler).serve_forever()
          PY

      - name: Run fixed Claude Code Action against the PR head
        continue-on-error: true
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: synthetic-key
          prompt: Synthetic impact-write probe. Do not edit files or call GitHub tools.
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:18080
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

      - name: Emit synthetic write marker
        if: always()
        shell: bash
        run: |
          if test -f /tmp/impact-write-marker; then
            cat /tmp/impact-write-marker
          else
            echo IMPACT_WRITE_MARKER_NOT_CREATED
          fi
