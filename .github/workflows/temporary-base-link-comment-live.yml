name: temporary-base-link-comment-live
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  probe:
    if: ${{ github.event.issue.pull_request && contains(github.event.comment.body, '@claude') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head for the controlled fixture
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Start local 401 API stub
        shell: bash
        run: |
          cat > /tmp/claude-api-stub.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(401)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(b'{"error":{"type":"authentication_error","message":"synthetic"}}')
              def do_POST(self):
                  self.do_GET()
              def log_message(self, format, *args):
                  return
          HTTPServer(("127.0.0.1", 18080), Handler).serve_forever()
          PY
          nohup python3 /tmp/claude-api-stub.py >/tmp/claude-api-stub.log 2>&1 &

      - name: Run fixed Claude Code Action from an owner-triggered PR comment
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13
        with:
          prompt: "Synthetic startup probe. Do not edit files and do not call GitHub write tools."
          anthropic_api_key: synthetic-key
          github_token: ${{ github.token }}
          claude_args: "--max-turns 1"
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:18080
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

      - name: Emit startup marker result
        if: always()
        shell: bash
        run: |
          if test -f /tmp/base-link-live-marker; then
            cat /tmp/base-link-live-marker
          else
            echo BASE_LINK_LIVE_MARKER_NOT_CREATED
          fi