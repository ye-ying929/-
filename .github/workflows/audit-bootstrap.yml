name: audit-bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-test-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create bot-authored test PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='audit/review-sha-20261027'
          git checkout -b "$branch"
          printf 'initial review-sha fixture\n' > audit-review-sha.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit-review-sha.txt
          git commit -m 'audit: initial review-sha fixture'
          git push origin "HEAD:$branch"
          gh pr create --base main --head "$branch" \
            --title 'audit: review approval head SHA fixture' \
            --body 'Temporary authorized security validation. Close and delete after the run.'
